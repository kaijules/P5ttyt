<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trang liên kết" />
    <title>Liên Kết</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div class="aurora-bg"></div>

    <main class="profile-container">
      <header class="profile-header">
        <div class="avatar-container">
          <img src="./avt.JPG" class="avatar" alt="avt" />
        </div>
        <h1 class="name">Ewiges</h1>
        <p class="bio">@loveisubtw</p>
      </header>

      <div class="social-icons">
        <a href="https://www.tiktok.com/@loveisubtw" class="social-link" aria-label="TikTok"><i class="ph ph-tiktok-logo"></i></a>
        <a href="https://www.youtube.com/@w4urluv" class="social-link" aria-label="YouTube"><i class="ph ph-youtube-logo"></i></a>
        <a href="https://open.spotify.com/playlist/7svEqt67izltFBi2uBr1Kp" class="social-link" aria-label="Spotify"><i class="ph ph-spotify-logo"></i></a>
      </div>

      <div class="links-container">
        <a href="https://open.spotify.com/playlist/7svEqt67izltFBi2uBr1Kp" class="link-btn">
          <i class="ph ph-music-notes"></i>
          <span>Playlist Spotify Của Mình</span>
        </a>

        <a href="https://www.youtube.com/@w4urluv" class="link-btn">
          <i class="ph ph-youtube-logo"></i>
          <span>Playlist Youtube Của Mình</span>
        </a>

        <a href="mailto:ewivietsub@gmail.com" class="link-btn">
          <i class="ph ph-envelope-simple"></i>
          <span>ewivietsub@gmail.com</span>
        </a>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
